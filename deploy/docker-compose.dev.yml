# Development: bind-mount backend + frontend for instant code reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - vernika_data:/app/backend/data

  whatsapp-proxy:
    build:
      context: ./whatsapp-proxy
      dockerfile: Dockerfile
    volumes:
      - ./whatsapp-proxy:/app
      - whatsapp_session:/app/whatsapp-session
    command: ["node", "index.js"]

volumes:
  vernika_data:
  whatsapp_session:
