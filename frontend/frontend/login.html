<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <title>Vernika Pro | Sign In</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .login-container {
            display: flex;
            min-height: 100dvh;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding:
                max(var(--space-lg), env(safe-area-inset-top, 0px))
                max(var(--space-lg), env(safe-area-inset-right, 0px))
                max(var(--space-lg), env(safe-area-inset-bottom, 0px))
                max(var(--space-lg), env(safe-area-inset-left, 0px));
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: var(--space-3xl);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-3xl);
        }

        .login-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto var(--space-xl);
            background: var(--primary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: white;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
        }

        .login-title {
            font-size: var(--text-2xl);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-sm);
        }

        .login-subtitle {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
            margin-bottom: var(--space-xl);
        }

        .login-form input {
            padding: var(--space-lg);
            font-size: var(--text-base);
        }

        .login-error {
            display: none;
            padding: var(--space-lg);
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: var(--radius-md);
            color: var(--danger);
            font-size: var(--text-sm);
            font-weight: 500;
        }

        .login-error.show {
            display: block;
        }

        .login-button {
            padding: var(--space-lg) var(--space-xl);
            font-size: var(--text-base);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-footer {
            text-align: center;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">V</div>
                <h1 class="login-title">Vernika Pro</h1>
                <p class="login-subtitle">Enterprise AI Communication Platform</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Email address" 
                        required 
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Password" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <div id="error-msg" class="login-error"></div>

                <button type="submit" class="btn btn-primary btn-lg btn-block login-button" id="btn-submit">
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                &copy; 2026 Vernika Pro &bull; Secure Enterprise Node
            </div>
        </div>
    </div>

    <script>
        function loginApiRoot() {
            if (typeof window !== 'undefined' && window.__VERN_API_ROOT__) {
                return String(window.__VERN_API_ROOT__).replace(/\/$/, '');
            }
            const meta =
                typeof document !== 'undefined'
                    ? document.querySelector('meta[name="vernika-api-root"]')
                    : null;
            if (meta && meta.content && meta.content.trim()) {
                return meta.content.trim().replace(/\/$/, '');
            }
            return '';
        }
        function loginApiUrl(p) {
            const path = p.startsWith('/') ? p : '/' + p;
            const root = loginApiRoot();
            return root ? root + path : path;
        }
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');
            
            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerText = 'Verifying...';

            try {
                const res = await fetch(loginApiUrl('/api/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password }),
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('vernika_token', data.token);
                    localStorage.setItem('vernika_role', data.role || 'data_edge');
                    localStorage.setItem('vernika_email', email);
                    
                    btn.innerText = '✓ Authorized';
                    btn.style.background = '#34C759';
                    
                    setTimeout(() => {
                        window.location.href = '/console';
                    }, 600);
                } else {
                    errorMsg.innerText = 'Invalid email or password. Please try again.';
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.innerText = 'Sign In';
                }
            } catch (err) {
                errorMsg.innerText = 'Connection error. Please check your internet and try again.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        };
    </script>
</body>
</html>
