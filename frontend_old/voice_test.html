<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Voice Test | VernikaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --accent: #007AFF;
            --bg: #000000;
            --card: #0D0D0D;
            --border: #1F1F1F;
            --text: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; }

        .container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 40px;
        }

        .voice-orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            filter: blur(20px);
            opacity: 0.3;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .voice-orb.active {
            opacity: 0.8;
            transform: scale(1.2);
            box-shadow: 0 0 80px var(--accent);
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 40px;
        }

        .controls {
            margin-top: 60px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 40px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 14px;
        }

        .btn-primary { background: var(--accent); border: none; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            margin-top: 20px;
        }

        .wave-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status-badge">System Ready</div>
        
        <div id="orb" class="voice-orb"></div>
        
        <div class="wave-container" id="wave">
            <!-- Bars generated via JS -->
        </div>

        <div class="mt-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">Neural Live Link</h1>
            <p id="subtext" class="text-gray-500 font-medium">Test your prompted persona in real-time</p>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-primary" onclick="startTest()">Start Neural Link</button>
            <button id="stop-btn" class="btn btn-secondary" onclick="stopTest()" disabled>Disconnect</button>
        </div>

        <div class="mt-12 p-6 bg-[#0D0D0D] border border-[#1F1F1F] rounded-2xl max-w-md text-center">
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Active Persona</p>
            <p id="role-label" class="text-blue-500 font-black uppercase text-sm"></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'sellers';
        document.getElementById('role-label').innerText = role;

        let ws = null;
        let audioContext = null;
        let processor = null;
        let microphone = null;

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        // Create wave bars
        const wave = document.getElementById('wave');
        for(let i=0; i<30; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = '4px';
            wave.appendChild(bar);
        }

        async function startTest() {
            try {
                status.innerText = "Connecting...";
                startBtn.disabled = true;

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/web-demo?role=${role}`);
                
                ws.onopen = async () => {
                    status.innerText = "Neural Link Established";
                    orb.classList.add('active');
                    stopBtn.disabled = false;
                    await initAudio();
                };

                ws.onmessage = async (e) => {
                    const msg = JSON.parse(e.data);
                    if(msg.type === 'audio') {
                        playResponse(msg.data);
                    }
                };

                ws.onclose = () => {
                    status.innerText = "Link Severed";
                    orb.classList.remove('active');
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    if(audioContext) audioContext.close();
                };

            } catch(e) {
                console.error(e);
                status.innerText = "Initialization Failed";
                startBtn.disabled = false;
            }
        }

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            microphone = audioContext.createMediaStreamSource(stream);
            
            // Use ScriptProcessor for low-level PCM access
            // In a real prod app, use AudioWorklet for better performance
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0);
                // Convert float32 to int16
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                
                if(ws && ws.readyState === WebSocket.OPEN) {
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(pcmData.buffer)));
                    ws.send(JSON.stringify({ type: 'audio', data: base64 }));
                }

                // Update visualizer
                updateWave(inputData);
            };

            microphone.connect(processor);
            processor.connect(audioContext.destination);
        }

        function updateWave(data) {
            const bars = document.querySelectorAll('.wave-bar');
            const step = Math.floor(data.length / bars.length);
            for(let i=0; i<bars.length; i++) {
                const val = Math.abs(data[i*step]) * 40;
                bars[i].style.height = `${Math.max(4, val)}px`;
            }
        }

        function playResponse(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const pcm = new Int16Array(bytes.buffer);
            
            // Convert int16 to float32
            const floatData = new Float32Array(pcm.length);
            for(let i=0; i<pcm.length; i++) floatData[i] = pcm[i] / 0x7FFF;
            
            const buffer = audioContext.createBuffer(1, floatData.length, 16000);
            buffer.getChannelData(0).set(floatData);
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start();
        }

        function stopTest() {
            if(ws) ws.close();
            if(audioContext) audioContext.close();
        }
    </script>
</body>
</html>
